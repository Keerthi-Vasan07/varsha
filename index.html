<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Varsha ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff7f8;
            font-family: Georgia, serif;
            text-align: center;
        }

        .birthday {
            padding: 20px;
            max-width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 5rem);
            font-weight: normal;
            color: #b74768;
            letter-spacing: -1px;
        }

        p {
            margin-top: 16px;
            font-family: Arial, sans-serif;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            color: #98727d;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .heart {
            color: #d66b87;
        }

        .emoji {
            display: inline-block;
            font-size: 1.6rem;
            vertical-align: middle;
            margin-left: 5px;
            letter-spacing: 0;
        }
    </style>
</head>

<body>

    <main class="birthday">
        <h1>
            Happy Birthday Varsha<span class="heart"> ♡</span>
        </h1>

        <p>
            thiruttu nai hey v2 uh poi thaane unna paka sonen
            <span class="emoji">🧐</span>
        </p>
    </main>

</body>
</html>
